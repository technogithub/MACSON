# ==============================================================================
# FreeRADIUS Custom Multi-SSID MAC Authentication & Dynamic VLAN SQL Queries
# ==============================================================================

# Query to Check MAC Address & Multi-SSID Device Status with Dynamic VLAN Lookup
# Per-device VLAN (devices.vlan_id) takes priority over SSID VLAN (ssids.vlan_id).
# Parameters: %{request:Tmp-String-3} (MAC), %{request:Tmp-String-1} (SSID)
authorize_check_query = "\
    SELECT d.status, \
           COALESCE(d.vlan_id, s.vlan_id, 0) AS vlan_id \
    FROM devices d \
    LEFT JOIN device_ssids ds ON ds.device_id = d.id \
    LEFT JOIN ssids s ON (ds.ssid_id = s.id AND s.ssid_name = '%{request:Tmp-String-1}') \
    WHERE d.mac_address = '%{request:Tmp-String-3}' \
      AND d.status = 'active' \
      AND ( \
        s.ssid_name = '%{request:Tmp-String-1}' \
        OR ds.ssid_id IS NULL \
        OR d.ssid = '%{request:Tmp-String-1}' \
        OR d.ssid = 'ALL' \
      ) \
    ORDER BY CASE \
      WHEN d.vlan_id IS NOT NULL THEN 0 \
      WHEN s.ssid_name = '%{request:Tmp-String-1}' THEN 1 \
      WHEN d.ssid = '%{request:Tmp-String-1}' THEN 2 \
      ELSE 3 \
    END \
    LIMIT 1"

# Query to Log Successful Auth (ACCEPT) into radius_log with SSID
log_auth_accept_query = "\
    INSERT INTO radius_log (log_date, mac_address, ssid, username, nas_ip, nas_port, auth_result, reason) \
    VALUES (NOW(), '%{request:Tmp-String-3}', '%{request:Tmp-String-1}', '%{User-Name}', '%{NAS-IP-Address}', '%{NAS-Port}', 'ACCEPT', 'MAC & SSID Authorized')"

# Query to Log Rejected Auth (REJECT) into radius_log with SSID
log_auth_reject_query = "\
    INSERT INTO radius_log (log_date, mac_address, ssid, username, nas_ip, nas_port, auth_result, reason) \
    VALUES (NOW(), '%{request:Tmp-String-3}', '%{request:Tmp-String-1}', '%{User-Name}', '%{NAS-IP-Address}', '%{NAS-Port}', 'REJECT', '%{request:Tmp-String-6}')"



# Standard Accounting Queries
accounting_on_query = "\
    UPDATE radacct SET \
        acctstoptime = NOW(), \
        acctsessiontime = UNIX_TIMESTAMP(NOW()) - UNIX_TIMESTAMP(acctstarttime), \
        acctterminatecause = 'NAS-Reboot' \
    WHERE acctstoptime IS NULL AND nasipaddress = '%{NAS-IP-Address}' AND acctstarttime <= NOW()"

accounting_start_query = "\
    INSERT INTO radacct \
        (acctsessionid, acctuniqueid, username, nasipaddress, nasportid, acctstarttime, callingstationid, framedipaddress) \
    VALUES \
        ('%{Acct-Session-Id}', '%{Acct-Unique-Session-Id}', '%{User-Name}', '%{NAS-IP-Address}', '%{NAS-Port-Id}', NOW(), '%{Calling-Station-Id}', '%{Framed-IP-Address}')"

accounting_stop_query = "\
    UPDATE radacct SET \
        acctstoptime = NOW(), \
        acctsessiontime = '%{Acct-Session-Time}', \
        acctinputoctets = '%{Acct-Input-Octets}', \
        acctoutputoctets = '%{Acct-Output-Octets}', \
        acctterminatecause = '%{Acct-Terminate-Cause}' \
    WHERE acctsessionid = '%{Acct-Session-Id}' AND nasipaddress = '%{NAS-IP-Address}'"
