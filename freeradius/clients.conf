# ==============================================================================
# FreeRADIUS Client Configuration - clients.conf
# Enterprise RADIUS NAS Gateway Definitions (Mikrotik / Cisco / Ruckus / Aruba)
# ==============================================================================

# Localhost Loopback Subnet (for radtest & local testing on 127.0.0.1 / 127.0.1.1)
client localhost_subnet {
    ipaddr      = 127.0.0.0/8
    proto       = *
    secret      = testing123
    shortname   = localhost
    nas_type    = other
}

# Docker Bridge & Private Subnets Access (testing123)
client docker_bridge {
    ipaddr      = 172.16.0.0/12
    secret      = testing123
    shortname   = docker_bridge
    nas_type    = other
}

# Docker Container Subnet NAS Access
client docker_subnet {
    ipaddr      = 172.18.0.0/16
    secret      = RadiusSecretKey2026!
    shortname   = docker_net
    nas_type    = other
}

# Mikrotik Router / Access Point Controller
client mikrotik_nas {
    ipaddr      = 192.168.0.0/16
    secret      = MikrotikRadiusPass2026!
    shortname   = mikrotik_gateway
    nas_type    = mikrotik
}

# Cisco Access Point / WLC Controller
client cisco_wlc {
    ipaddr      = 10.0.0.0/8
    secret      = CiscoRadiusPass2026!
    shortname   = cisco_wlc
    nas_type    = cisco
}

