# ==============================================================================
# FreeRADIUS Client Configuration - clients.conf
# Enterprise RADIUS NAS Gateway Definitions (Mikrotik / Cisco / Ruckus / Aruba)
# ==============================================================================

# Localhost & Loopback Subnet for radtest (secret: testing123)
client localhost_testing {
    ipaddr      = 127.0.0.0/8
    secret      = testing123
    shortname   = localhost
    nas_type    = other
}

# Docker Network & Host Bridge for radtest (secret: testing123)
client docker_subnet {
    ipaddr      = 172.16.0.0/12
    secret      = testing123
    shortname   = docker_net
    nas_type    = other
}

# Production NAS & All Network Access (secret: RadiusSecretKey2026!)
client wildcard_production {
    ipaddr      = 0.0.0.0/0
    secret      = RadiusSecretKey2026!
    shortname   = wildcard_prod
    nas_type    = other
}




