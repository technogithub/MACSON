services:
  # ----------------------------------------------------------------------------
  # 1. Database: MariaDB 10.11
  # ----------------------------------------------------------------------------
  mariadb:
    image: mariadb:10.11
    container_name: radius_mariadb
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootPassword2026!
      MYSQL_DATABASE: radius
      MYSQL_USER: radius_user
      MYSQL_PASSWORD: radius_password
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ../sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - radius_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "radius_user", "-pradius_password"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  # ----------------------------------------------------------------------------
  # 2. Redis Cache & Queue Broker
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: radius_redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - radius_net

  # ----------------------------------------------------------------------------
  # 3. Backend: PHP 8.3 Laravel App
  # NOTE: app_code named volume is populated from the built image (vendor intact).
  #       Nginx shares the same named volume to serve public/ files.
  # ----------------------------------------------------------------------------
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: radius_laravel_app
    restart: always
    environment:
      APP_NAME: "MACSON"
      APP_ENV: production
      APP_KEY: "base64:aDhOa1YybzVCMXE3WThkM1I0cDlNNmExRjJ0M0U0eDU="
      APP_DEBUG: "true"
      APP_URL: "http://localhost"
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: radius
      DB_USERNAME: radius_user
      DB_PASSWORD: radius_password
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: cookie
      SESSION_LIFETIME: 120
      SESSION_ENCRYPT: "false"
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - app_code:/var/www/html
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - radius_net

  # ----------------------------------------------------------------------------
  # 4. Laravel Background Queue Worker
  # ----------------------------------------------------------------------------
  queue_worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: radius_queue_worker
    restart: always
    command: php /var/www/html/artisan queue:work --sleep=3 --tries=3
    environment:
      APP_ENV: production
      APP_KEY: "base64:aDhOa1YybzVCMXE3WThkM1I0cDlNNmExRjJ0M0U0eDU="
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: 3306
      DB_DATABASE: radius
      DB_USERNAME: radius_user
      DB_PASSWORD: radius_password
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: cookie
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - app_code:/var/www/html
    depends_on:
      - app
      - redis
    networks:
      - radius_net

  # ----------------------------------------------------------------------------
  # 5. Web Server: Nginx
  # ----------------------------------------------------------------------------
  webserver:
    image: nginx:alpine
    container_name: radius_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - app_code:/var/www/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - radius_net

  # ----------------------------------------------------------------------------
  # 6. RADIUS Engine: FreeRADIUS 3.x
  # ----------------------------------------------------------------------------
  freeradius:
    build:
      context: ..
      dockerfile: docker/freeradius.Dockerfile
    container_name: radius_freeradius
    restart: always
    command: >
      sh -c "ln -sf /etc/freeradius/3.0/mods-available/sql /etc/freeradius/3.0/mods-enabled/sql && freeradius -X"
    ports:
      - "1812:1812/udp"
      - "1813:1813/udp"
    volumes:
      - ../freeradius/clients.conf:/etc/freeradius/3.0/clients.conf:ro
      - ../freeradius/mods-available/sql:/etc/freeradius/3.0/mods-available/sql:ro
      - ../freeradius/queries.conf:/etc/freeradius/3.0/mods-config/sql/main/mysql/queries.conf:ro
      - ../freeradius/sites-available/default:/etc/freeradius/3.0/sites-available/default:ro
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - radius_net

  # ----------------------------------------------------------------------------
  # 7. Database Web Management: phpMyAdmin
  # Access via http://<SERVER-IP>:8080
  # ----------------------------------------------------------------------------
  phpmyadmin:
    image: phpmyadmin:5
    container_name: radius_phpmyadmin
    restart: always
    environment:
      PMA_HOST: mariadb
      PMA_PORT: 3306
      PMA_USER: radius_user
      PMA_PASSWORD: radius_password
      MYSQL_ROOT_PASSWORD: RootPassword2026!
    ports:
      - "8080:80"
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - radius_net

networks:
  radius_net:
    driver: bridge

volumes:
  mariadb_data:
  app_code:

